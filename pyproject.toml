[project]
name = "cli-pedidos"
version = "1.0.0"
description = "CLI para gerenciar pedidos de uma lavanderia, com persistencia em SQLite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Henrique Lira" }]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cli-pedidos = "cli_pedidos.cli:menu"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
